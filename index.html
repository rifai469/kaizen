<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaizen Temuan</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--tx:#1b1f27;--mu:#667085;--bd:#d6dae1;--ac:#0b4f9c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
@media screen{html,body{height:100%;overflow:hidden}}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto}
header{padding:12px 16px 8px;font-weight:800;font-size:19px}
main{flex:1;min-height:0;padding:0 12px 10px;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}.view[hidden]{display:none}
#pick{position:relative;flex:1;min-height:90px;border:2px dashed var(--bd);border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;color:var(--mu);font-size:17px}
#pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0}
#pv{max-width:100%;max-height:100%;object-fit:contain}#pv:not([hidden])~#ph{display:none}
textarea,input[type=text],select{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);min-height:44px}
textarea{width:100%;height:78px;resize:none}
.big{height:54px;font:inherit;font-size:18px;font-weight:700;border:0;border-radius:12px;background:var(--ac);color:#fff;width:100%}.big:disabled{opacity:.5}
nav{display:flex;border-top:1px solid var(--bd);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:58px;border:0;background:none;font:inherit;font-size:15px;color:var(--mu)}nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
.bar{display:flex;gap:8px}.bar input{flex:1;min-width:0}
.sm{display:flex;justify-content:space-between;align-items:center;gap:8px}.s{font-size:12px;color:var(--mu)}
.sm button,.row button{min-height:40px;padding:0 12px;font:inherit;font-size:14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
#list{flex:1;min-height:0;overflow-y:auto;background:var(--card);border-radius:12px;padding:0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--bd);padding:10px 0}.row:first-child{border-top:0}
.row input[type=checkbox]{width:22px;height:22px}.row img{width:60px;height:60px;object-fit:cover;border-radius:8px;background:var(--bd)}
.m{flex:1;min-width:0}.m b{display:block;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row select{min-height:40px;padding:0 8px;font-size:14px}.row .acts{width:100%;display:flex;gap:8px}.row .acts>*{flex:1}
#toast{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:99}#toast[hidden]{display:none}
#tbox{background:#fff;color:#1b1f27;border-radius:22px;padding:30px 22px;width:min(88vw,360px);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);border-top:10px solid #16a34a}
#tbox.err{border-top-color:#dc2626}#tbox.wait{border-top-color:#0b4f9c}
#ti{font-size:72px;line-height:1}#tt{font-size:23px;font-weight:800;margin-top:12px}
#pr{display:none}
/* ===== FORM CETAK ===== */
.pg{font:7pt Arial,Helvetica,sans-serif;color:#000;page-break-after:always;width:100%}
.pg table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:-1px}
.pg td{box-sizing:border-box;border:1px solid #000;padding:1px 3px;vertical-align:top;font-weight:normal;overflow:hidden}
.pg .ttl td{font-size:12.5pt;padding:1px 4px;height:19px;vertical-align:middle;border-bottom:0}
.pg .ttl img{height:15px;float:right}
.pg:last-child{page-break-after:auto}.pg b{font-weight:bold}.pg .c{text-align:center;white-space:nowrap}.pg td.m{white-space:nowrap}.pg .m{vertical-align:middle}
.pg .cb{display:inline-block;width:8px;height:8px;border:1px solid #000;vertical-align:middle;margin-right:5px;position:relative;top:-1px}
.pg .ck{margin:1px 0 1px 3px;line-height:12px}
.pg .ds{white-space:pre-wrap;word-break:break-word;font-size:7.5pt}
.pg .ft{height:228px;text-align:center;vertical-align:top}.pg .ft b{display:block;text-align:left}
.pg .ft img{display:block;margin:6px auto 0;max-width:100%;max-height:206px}
.pg .ln{box-sizing:border-box;border-bottom:1px solid #666;height:14px}
.pg .gt td:last-child{border-right:0}.pg .gt tr:last-child td{border-bottom:0}
.pg .hrt td:first-child{border-left:0}.pg .hrt td:last-child{border-right:0}.pg .hrt tr:first-child td{border-top:0}.pg .hrt tr:last-child td{border-bottom:0}
.pg .sgn{height:44px}.pg .nt td{height:13px;padding:0 2px}
.pg .nb{border:0!important;padding:0!important}
.pg .hr td{font-size:5pt;text-align:center;vertical-align:middle;padding:0 1px;height:12px;line-height:6.5pt}
.pg td.g{padding:0 3px;height:13px}
@media print{@page{size:A4 portrait;margin:8mm}body{background:#fff}#app{display:none}#pr{display:block}}
</style></head><body>
<div id="app">
<header>Kaizen – Temuan</header>
<main>
<div id="v1" class="view">
<div id="pick"><img id="pv" hidden><div id="ph">📷<br>Ketuk untuk ambil / pilih foto</div><input type="file" id="f" accept="image/*"></div>
<textarea id="d" placeholder="Tulis deskripsi temuan..."></textarea>
<button class="big" id="save">Simpan</button>
</div>
<div id="v2" class="view" hidden>
<div class="bar"><input type="text" id="q" placeholder="Cari deskripsi"><select id="fs"><option value="">Semua</option><option>Open</option><option>Proses</option><option>Selesai</option></select></div>
<div class="sm"><span class="s" id="sum"></span><button id="pa">Cetak yang dicentang</button></div>
<div id="list"></div>
</div>
</main>
<nav><button id="t1" class="on">📷 Upload</button><button id="t2">📋 Database</button></nav>
<button id="cfg" hidden></button>
<div id="toast" hidden><div id="tbox"><div id="ti"></div><div id="tt"></div></div></div>
</div>
<div id="pr"></div>

<script>
/* ================= KONFIGURASI ================= */
const CONFIG={
  mode:'supabase', // 'supabase' | 'github' | 'local' (local = simpan di browser, untuk coba-coba)
  supabase:{url:'https://namortrjbwukqqhamjcu.supabase.co',key:'sb_publishable_Ex-qopSjynEWFauJMpPKsg_ngV796fF',bucket:'kaizen-foto',allowDelete:false},
  github:{owner:'USERNAME',repo:'NAMA-REPO',branch:'main',dataPath:'data/temuan.json',imgDir:'images'}
};
/* ================================================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tmo;
function notify(k,t){const T=$('toast');clearTimeout(tmo);T.hidden=false;$('tbox').className=k;$('ti').textContent={ok:'✅',err:'⚠️',wait:'⏳'}[k];$('tt').textContent=t;if(k=='ok')tmo=setTimeout(()=>T.hidden=true,2400)}
$('toast').onclick=()=>{if($('tbox').className!='wait')$('toast').hidden=true};
const say=t=>t?notify(t=='Menyimpan...'?'wait':'err',t):($('toast').hidden=true);
const fmt=ts=>new Date(ts).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});

/* ---------- Storage adapter: list / add / update / remove ---------- */
const Local={
  async list(){try{return JSON.parse(localStorage.getItem('kz')||'[]')}catch(e){return[]}},
  async save(a){localStorage.setItem('kz',JSON.stringify(a))},
  async add(it,dataUrl){it.img=dataUrl;const a=await this.list();a.unshift(it);await this.save(a)},
  async update(id,p){const a=await this.list();const x=a.find(i=>i.id==id);if(x)Object.assign(x,p);await this.save(a)},
  async remove(id){await this.save((await this.list()).filter(i=>i.id!=id))}
};
const GH={
  g:CONFIG.github,
  api(p){return`https://api.github.com/repos/${this.g.owner}/${this.g.repo}/contents/${p}`},
  tok(){return localStorage.getItem('gh_token')||''},
  hdr(){const t=this.tok();return t?{Authorization:'Bearer '+t}:{}},
  async list(){const r=await fetch(this.api(this.g.dataPath)+'?ref='+this.g.branch,{headers:{Accept:'application/vnd.github.raw+json'}});if(r.status==404)return[];if(!r.ok)throw Error('Gagal baca data ('+r.status+')');return r.json()},
  async put(path,b64,sha,msg){const r=await fetch(this.api(path),{method:'PUT',headers:{...this.hdr(),'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:b64,branch:this.g.branch,...(sha?{sha}:{})})});if(!r.ok)throw Error('Gagal tulis ('+r.status+'). Cek token di ⚙');return r.json()},
  async mutate(fn){for(let i=0;i<2;i++){
    const r=await fetch(this.api(this.g.dataPath)+'?ref='+this.g.branch,{headers:this.hdr()});let arr=[],sha;
    if(r.ok){const j=await r.json();sha=j.sha;arr=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))))}
    fn(arr);try{return await this.put(this.g.dataPath,btoa(unescape(encodeURIComponent(JSON.stringify(arr)))),sha,'update temuan')}catch(e){if(i)throw e}}},
  async add(it,dataUrl){if(!this.tok())throw Error('Isi token GitHub dulu (tombol ⚙).');
    const path=this.g.imgDir+'/'+it.id+'.jpg';await this.put(path,dataUrl.split(',')[1],null,'foto '+it.id);it.img=path;await this.mutate(a=>a.unshift(it))},
  async update(id,p){await this.mutate(a=>{const x=a.find(i=>i.id==id);if(x)Object.assign(x,p)})},
  async remove(id){await this.mutate(a=>{const k=a.findIndex(i=>i.id==id);if(k>=0)a.splice(k,1)})}
};
const SB={
  c:CONFIG.supabase,
  h(x){const k=this.c.key,h={apikey:k,...x};if(k.startsWith('eyJ'))h.Authorization='Bearer '+k;return h},
  chk(){if(!this.c.key||this.c.key.startsWith('ISI'))throw Error('Key Supabase belum diisi di index.html')},
  pub(id){return`${this.c.url}/storage/v1/object/public/${this.c.bucket}/${id}.jpg`},
  async list(){this.chk();const r=await fetch(`${this.c.url}/rest/v1/kaizen_temuan?select=*&order=created.desc`,{headers:this.h()});if(!r.ok)throw Error('Gagal baca data ('+r.status+')');return(await r.json()).map(x=>({id:x.id,desc:x.deskripsi,created:+x.created,status:x.status,img:x.img}))},
  async add(it,dataUrl){this.chk();const blob=await(await fetch(dataUrl)).blob();
    let r=await fetch(`${this.c.url}/storage/v1/object/${this.c.bucket}/${it.id}.jpg`,{method:'POST',headers:this.h({'Content-Type':'image/jpeg'}),body:blob});if(!r.ok)throw Error('Upload foto gagal ('+r.status+')');
    r=await fetch(`${this.c.url}/rest/v1/kaizen_temuan`,{method:'POST',headers:this.h({'Content-Type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify({id:it.id,deskripsi:it.desc,created:it.created,status:it.status,img:this.pub(it.id)})});if(!r.ok)throw Error('Simpan data gagal ('+r.status+')')},
  async update(id,p){const r=await fetch(`${this.c.url}/rest/v1/kaizen_temuan?id=eq.${id}`,{method:'PATCH',headers:this.h({'Content-Type':'application/json'}),body:JSON.stringify(p)});if(!r.ok)throw Error('Gagal ubah status ('+r.status+')')},
  async remove(id){const r=await fetch(`${this.c.url}/rest/v1/kaizen_temuan?id=eq.${id}`,{method:'DELETE',headers:this.h()});if(!r.ok)throw Error('Gagal hapus ('+r.status+')')}
};
const Store={github:GH,supabase:SB,local:Local}[CONFIG.mode]||Local;

/* ---------- UI ---------- */
let items=[],img='';
const tab=n=>{$('v1').hidden=n!=1;$('v2').hidden=n!=2;$('t1').className=n==1?'on':'';$('t2').className=n==2?'on':''};
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>{tab(2);load()};
$('cfg').onclick=()=>{const t=prompt('Token GitHub (fine-grained, izin Contents: read & write). Hanya disimpan di browser ini.',GH.tok());if(t!==null)localStorage.setItem('gh_token',t.trim())};

function shrink(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
$('f').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{img=await shrink(f);$('pv').src=img;$('pv').hidden=false}catch(x){say('Foto gagal dibaca.')}};

$('save').onclick=async()=>{
  if(!img||!$('d').value.trim()){say('Foto dan deskripsi wajib diisi.');return}
  $('save').disabled=true;say('Menyimpan...');
  const it={id:Date.now().toString(36),desc:$('d').value.trim(),created:Date.now(),status:'Open'};
  try{await Store.add(it,img);notify('ok','Berhasil disimpan!');$('d').value='';$('f').value='';img='';$('pv').hidden=true}
  catch(e){say(e.message)}
  $('save').disabled=false};

async function load(){try{items=await Store.list();render()}catch(e){say(e.message)}}
function render(){
  const q=$('q').value.toLowerCase(),fs=$('fs').value;
  const v=items.filter(x=>(!fs||x.status==fs)&&(!q||x.desc.toLowerCase().includes(q)));
  const c=s=>items.filter(x=>x.status==s).length;
  $('sum').textContent=`Total ${items.length} • Open ${c('Open')} • Proses ${c('Proses')} • Selesai ${c('Selesai')}`;
  $('list').innerHTML=v.length?v.map(x=>`<div class="row"><input type="checkbox" data-c="${x.id}"><img src="${x.img}">
  <div class="m"><b>${esc(x.desc.slice(0,80))}${x.desc.length>80?'…':''}</b><span class="s">${fmt(x.created)}</span></div>
  <div class="acts"><select data-s="${x.id}">${['Open','Proses','Selesai'].map(s=>`<option${s==x.status?' selected':''}>${s}</option>`).join('')}</select>
  <button data-p="${x.id}">Cetak / PDF</button>${CONFIG.mode=='supabase'&&!CONFIG.supabase.allowDelete?'':`<button data-x="${x.id}">Hapus</button>`}</div></div>`).join(''):'<p class="s">Belum ada temuan.</p>';
  const L=$('list');
  L.querySelectorAll('[data-s]').forEach(e=>e.onchange=()=>Store.update(e.dataset.s,{status:e.value}).then(load).catch(x=>say(x.message)));
  L.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>printItems([e.dataset.p]));
  L.querySelectorAll('[data-x]').forEach(e=>e.onclick=()=>confirm('Hapus temuan ini?')&&Store.remove(e.dataset.x).then(load).catch(x=>say(x.message)))}
$('q').oninput=render;$('fs').onchange=render;
$('pa').onclick=()=>{const ids=[...document.querySelectorAll('[data-c]:checked')].map(e=>e.dataset.c);ids.length?printItems(ids):say('Centang temuan dulu.')};
